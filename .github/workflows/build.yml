name: Build Android DEX for Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download ADB platform-tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "assets\adb" -Force | Out-Null
          $url = "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          $zip = "$env:TEMP\platform-tools.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\platform-tools" -Force
          Copy-Item "$env:TEMP\platform-tools\platform-tools\adb.exe" -Destination "assets\adb\adb.exe"
          Copy-Item "$env:TEMP\platform-tools\platform-tools\AdbWinApi.dll" -Destination "assets\adb\AdbWinApi.dll"
          Copy-Item "$env:TEMP\platform-tools\platform-tools\AdbWinUsbApi.dll" -Destination "assets\adb\AdbWinUsbApi.dll"

      - name: Download scrcpy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "assets\scrcpy" -Force | Out-Null
          $tag = ((curl.exe -sL -o nul -w "%{url_effective}" "https://github.com/Genymobile/scrcpy/releases/latest") -replace ".*/tag/", "")
          $zipName = "scrcpy-win64-$tag.zip"
          $zipUrl = "https://github.com/Genymobile/scrcpy/releases/download/$tag/$zipName"
          $zip = "$env:TEMP\scrcpy.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\scrcpy" -Force
          $folder = "scrcpy-win64-$tag"
          Copy-Item "$env:TEMP\scrcpy\$folder\scrcpy.exe" -Destination "assets\scrcpy\scrcpy.exe"
          Copy-Item "$env:TEMP\scrcpy\$folder\scrcpy-server" -Destination "assets\scrcpy\scrcpy-server"

      - name: Build Windows
        run: flutter build windows --release

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $outDir = "build\android_dex_portable"
          New-Item -ItemType Directory -Path "$outDir\assets\adb" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outDir\assets\scrcpy" -Force | Out-Null
          $rb1 = robocopy "$buildDir" "$outDir" /E /NJH /NJS /NDL /NP /R:2 /W:2; if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $rb2 = robocopy "assets\adb" "$outDir\assets\adb" /E /NJH /NJS /NDL /NP /R:2 /W:2; if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $rb3 = robocopy "assets\scrcpy" "$outDir\assets\scrcpy" /E /NJH /NJS /NDL /NP /R:2 /W:2; if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          Compress-Archive -Path "$outDir\*" -DestinationPath "build\android_dex_win.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --confirm

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          if (-not $version) { $version = "0.9.2" }
          $stageDir = (Resolve-Path "build\android_dex_portable").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\installer.iss" /DMyAppVersion="$version" /DStageDir="$stageDir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dex-windows
          path: |
            build\android_dex_win.zip
            build\android_dex_setup_v*.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} build\android_dex_win.zip --clobber
          Get-ChildItem build\android_dex_setup_v*.exe | % {
            gh release upload ${{ github.event.release.tag_name }} $_.FullName --clobber
          }
