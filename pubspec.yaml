name: android_dex
description: Transform your Android device into a desktop experience.
publish_to: 'none'
version: 0.9.4+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  window_manager: ^0.5.2
  wakelock_plus: ^1.2.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.4
  local_notifier: ^0.1.6
  system_tray: ^2.0.3
  url_launcher: ^6.2.4
  http: ^1.2.1
  intl: ^0.19.0
  permission_handler: ^11.3.0
  mobile_scanner: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/adb/
    - assets/scrcpy/
